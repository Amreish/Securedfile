<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF DRM Protection System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo svg {
            width: 40px;
            height: 40px;
            color: #667eea;
        }
        
        h1 {
            color: #1a202c;
            font-size: 28px;
        }
        
        h2 {
            color: #2d3748;
            font-size: 20px;
            margin-bottom: 20px;
        }
        
        .subtitle {
            color: #667eea;
            font-size: 14px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #718096;
            color: white;
        }
        
        .btn-danger {
            background: #f56565;
            color: white;
        }
        
        .btn-warning {
            background: #ed8936;
            color: white;
        }
        
        .upload-area {
            border: 3px dashed #cbd5e0;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        
        .upload-area svg {
            width: 50px;
            height: 50px;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .code-display {
            background: #1a202c;
            color: #48bb78;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 24px;
            text-align: center;
            margin: 10px 0;
            letter-spacing: 2px;
        }
        
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .alert-success {
            background: #c6f6d5;
            border: 2px solid #48bb78;
            color: #22543d;
        }
        
        .alert-warning {
            background: #feebc8;
            border: 2px solid #ed8936;
            color: #7c2d12;
        }
        
        .alert-danger {
            background: #fed7d7;
            border: 2px solid #f56565;
            color: #742a2a;
        }
        
        .doc-item {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px solid #e2e8f0;
        }
        
        .doc-item h3 {
            color: #2d3748;
            margin-bottom: 10px;
        }
        
        .doc-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        
        .stat {
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 12px;
            color: #718096;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #2d3748;
        }
        
        .hidden {
            display: none;
        }
        
        .watermark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.08;
        }
        
        .watermark-text {
            position: absolute;
            transform: rotate(-45deg);
            font-size: 20px;
            font-weight: bold;
            color: #ff0000;
            white-space: nowrap;
        }
        
        .pdf-content {
            background: white;
            padding: 40px;
            border-radius: 10px;
            min-height: 600px;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .viewer-header {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .flex {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .copy-btn {
            padding: 8px 12px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .link-input {
            font-size: 12px;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border: 1px solid #4a5568;
            color: white;
        }
        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }
            
            .doc-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // State Management
        let state = {
            mode: 'owner', // 'owner' or 'viewer'
            docs: [],
            currentDoc: null,
            viewerEmail: '',
            accessCode: '',
            isAuthenticated: false,
            viewingDoc: null,
            sessionId: Math.random().toString(36).substr(2, 12),
            screenshotAttempts: 0
        };

        // Initialize
        function init() {
            loadDocs();
            checkURLParams();
            render();
            setupEventListeners();
        }

        function loadDocs() {
            const stored = localStorage.getItem('drm_documents');
            if (stored) {
                try {
                    state.docs = JSON.parse(stored);
                } catch (e) {
                    console.error('Error loading docs:', e);
                }
            }
        }

        function saveDocs() {
            try {
                localStorage.setItem('drm_documents', JSON.stringify(state.docs));
            } catch (e) {
                alert('⚠️ Storage limit exceeded!');
            }
        }

        function checkURLParams() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            if (code) {
                state.accessCode = code;
                state.mode = 'viewer';
            }
        }

        function generateCode() {
            return Math.random().toString(36).substr(2, 10).toUpperCase();
        }

        function handleFileUpload(file) {
            if (!file || file.type !== 'application/pdf') {
                alert('⚠️ Please upload a PDF file');
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                alert('⚠️ File too large (max 10MB)');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const newDoc = {
                    id: Date.now().toString(),
                    name: file.name,
                    size: file.size,
                    uploadDate: new Date().toISOString(),
                    accessCode: generateCode(),
                    data: e.target.result,
                    views: [],
                    securityEvents: [],
                    status: 'active'
                };

                state.docs.push(newDoc);
                state.currentDoc = newDoc;
                saveDocs();
                render();
            };
            reader.readAsDataURL(file);
        }

        function authenticate() {
            if (!state.viewerEmail || !state.accessCode) {
                alert('⚠️ Please enter email and access code');
                return;
            }

            const doc = state.docs.find(d => d.accessCode === state.accessCode.toUpperCase().trim());
            
            if (!doc) {
                alert('❌ Invalid access code');
                return;
            }

            if (doc.status !== 'active') {
                alert('❌ Access revoked');
                return;
            }

            // Log access
            doc.views.push({
                email: state.viewerEmail,
                timestamp: new Date().toISOString(),
                sessionId: state.sessionId
            });

            state.viewingDoc = doc;
            state.isAuthenticated = true;
            saveDocs();
            render();
            setupSecurityListeners();
        }

        function setupSecurityListeners() {
            document.addEventListener('keydown', (e) => {
                // Screenshot detection
                if (e.key === 'PrintScreen' || 
                    (e.metaKey && e.shiftKey && ['3','4','5'].includes(e.key))) {
                    e.preventDefault();
                    state.screenshotAttempts++;
                    logSecurityEvent('SCREENSHOT_ATTEMPT');
                    alert('⚠️ SECURITY ALERT\n\nScreenshot detected!\nYour email and session have been logged.');
                    render();
                }

                // Block print
                if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                    e.preventDefault();
                    alert('⛔ Printing is disabled');
                }

                // Block save
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    alert('⛔ Saving is disabled');
                }

                // Block copy
                if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
                    e.preventDefault();
                    alert('⛔ Copying is disabled');
                }
            });

            document.addEventListener('contextmenu', (e) => {
                e.preventDefault();
            });

            document.addEventListener('copy', (e) => {
                e.preventDefault();
            });
        }

        function logSecurityEvent(type) {
            if (state.viewingDoc) {
                const event = {
                    type: type,
                    email: state.viewerEmail,
                    timestamp: new Date().toISOString(),
                    sessionId: state.sessionId
                };

                state.viewingDoc.securityEvents = state.viewingDoc.securityEvents || [];
                state.viewingDoc.securityEvents.push(event);
                
                const docIndex = state.docs.findIndex(d => d.id === state.viewingDoc.id);
                if (docIndex !== -1) {
                    state.docs[docIndex] = state.viewingDoc;
                    saveDocs();
                }
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ Copied to clipboard!');
            });
        }

        function revokeAccess(docId) {
            if (confirm('⚠️ Revoke access to this document?')) {
                const doc = state.docs.find(d => d.id === docId);
                if (doc) {
                    doc.status = 'revoked';
                    saveDocs();
                    render();
                }
            }
        }

        function deleteDoc(docId) {
            if (confirm('⚠️ Delete this document permanently?')) {
                state.docs = state.docs.filter(d => d.id !== docId);
                saveDocs();
                render();
            }
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function formatDate(isoString) {
            return new Date(isoString).toLocaleString();
        }

        function getShareLink(code) {
            return window.location.origin + window.location.pathname + '?code=' + code;
        }

        // Render Functions
        function render() {
            const app = document.getElementById('app');
            
            if (state.mode === 'owner') {
                app.innerHTML = renderOwner();
            } else if (!state.isAuthenticated) {
                app.innerHTML = renderAuth();
            } else {
                app.innerHTML = renderViewer();
            }
            
            setupEventListeners();
        }

        function renderOwner() {
            return `
                <div class="container">
                    <div class="card">
                        <div class="header">
                            <div class="logo">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                                <div>
                                    <h1>PDF DRM System</h1>
                                    <div class="subtitle">Zero-Cost Protection</div>
                                </div>
                            </div>
                            <button class="btn btn-primary" onclick="switchMode('viewer')">
                                Viewer Mode
                            </button>
                        </div>

                        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                            </svg>
                            <h3>Click to Upload PDF</h3>
                            <p style="color: #718096; margin-top: 10px;">Maximum 10MB</p>
                            <input type="file" id="fileInput" accept="application/pdf">
                        </div>

                        ${state.currentDoc ? `
                            <div class="alert alert-success">
                                <h3 style="margin-bottom: 10px;">✅ Document Uploaded Successfully!</h3>
                                <p><strong>Access Code:</strong></p>
                                <div class="code-display">${state.currentDoc.accessCode}</div>
                                <p style="margin: 10px 0;"><strong>Share Link:</strong></p>
                                <div class="flex">
                                    <input type="text" class="link-input" value="${getShareLink(state.currentDoc.accessCode)}" readonly style="flex: 1; color: #1a202c;">
                                    <button class="copy-btn" onclick="copyToClipboard('${getShareLink(state.currentDoc.accessCode)}')">
                                        Copy Link
                                    </button>
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <div class="card">
                        <h2>📊 Your Documents (${state.docs.length})</h2>
                        ${state.docs.length === 0 ? 
                            '<p style="text-align: center; color: #718096; padding: 40px;">No documents uploaded yet</p>' :
                            state.docs.map(doc => `
                                <div class="doc-item">
                                    <h3>${doc.name}</h3>
                                    <div class="doc-stats">
                                        <div class="stat">
                                            <div class="stat-label">Code</div>
                                            <div class="stat-value" style="color: #667eea; font-size: 14px;">${doc.accessCode}</div>
                                        </div>
                                        <div class="stat">
                                            <div class="stat-label">Status</div>
                                            <div class="stat-value" style="color: ${doc.status === 'active' ? '#48bb78' : '#f56565'}; font-size: 14px;">
                                                ${doc.status === 'active' ? '✓ Active' : '✗ Revoked'}
                                            </div>
                                        </div>
                                        <div class="stat">
                                            <div class="stat-label">Views</div>
                                            <div class="stat-value">${doc.views.length}</div>
                                        </div>
                                        <div class="stat">
                                            <div class="stat-label">Alerts</div>
                                            <div class="stat-value" style="color: #ed8936;">${(doc.securityEvents || []).length}</div>
                                        </div>
                                    </div>
                                    <div class="flex">
                                        ${doc.status === 'active' ? 
                                            `<button class="btn btn-warning" onclick="revokeAccess('${doc.id}')">Revoke</button>` : 
                                            ''}
                                        <button class="btn btn-danger" onclick="deleteDoc('${doc.id}')">Delete</button>
                                        <button class="copy-btn" onclick="copyToClipboard('${getShareLink(doc.accessCode)}')">Copy Link</button>
                                    </div>
                                </div>
                            `).join('')
                        }
                    </div>
                </div>
            `;
        }

        function renderAuth() {
            return `
                <div class="container" style="max-width: 500px; margin-top: 50px;">
                    <div class="card">
                        <div style="text-align: center; margin-bottom: 30px;">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 60px; height: 60px; margin: 0 auto 15px; color: #667eea;">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                            <h1>🔒 Secure Access</h1>
                        </div>

                        <label>📧 Your Email Address</label>
                        <input type="email" id="emailInput" placeholder="client@example.com" value="${state.accessCode ? '' : ''}">

                        <label>🔑 Access Code</label>
                        <input type="text" id="codeInput" placeholder="Enter access code" value="${state.accessCode}" style="text-transform: uppercase; font-family: monospace;">

                        <button class="btn btn-primary" style="width: 100%; margin-bottom: 10px;" onclick="handleAuth()">
                            🔓 Access Document
                        </button>

                        <button class="btn btn-secondary" style="width: 100%;" onclick="switchMode('owner')">
                            I'm the Owner
                        </button>

                        <div class="alert alert-warning" style="margin-top: 20px;">
                            <strong>⚠️ Security Notice:</strong>
                            <ul style="margin: 10px 0 0 20px; font-size: 13px;">
                                <li>All activities are monitored</li>
                                <li>Screenshots are tracked</li>
                                <li>Unauthorized sharing is prohibited</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderViewer() {
            const time = new Date().toLocaleTimeString();
            return `
                <div class="watermark">
                    ${[...Array(8)].map((_, i) => `
                        <div class="watermark-text" style="top: ${i * 12 + 5}%; left: 50%; transform: translateX(-50%) rotate(-45deg);">
                            CONFIDENTIAL • ${state.viewerEmail} • ${time} • ${state.sessionId.slice(0,8)}
                        </div>
                    `).join('')}
                </div>

                <div class="container">
                    <div class="viewer-header">
                        <div class="flex">
                            <span>🔒 Protected Document</span>
                        </div>
                        <div class="flex" style="font-size: 12px;">
                            <span>👤 ${state.viewerEmail}</span>
                            <span>🕐 ${time}</span>
                        </div>
                    </div>

                    ${state.screenshotAttempts > 0 ? `
                        <div class="alert alert-danger">
                            🚨 ${state.screenshotAttempts} screenshot attempt(s) detected and logged!
                        </div>
                    ` : ''}

                    <div class="pdf-content">
                        <h1 style="text-align: center; color: #2d3748; margin-bottom: 20px;">
                            ${state.viewingDoc.name}
                        </h1>
                        <div style="background: #f7fafc; padding: 30px; border-radius: 10px; line-height: 1.8;">
                            <p style="color: #4a5568; margin-bottom: 15px;">
                                <strong>📄 This is your protected PDF document.</strong>
                            </p>
                            <p style="color: #718096; margin-bottom: 15px;">
                                In production, this viewer would use PDF.js library to render actual PDF pages as canvas elements, preventing downloads and adding watermarks directly onto each page.
                            </p>
                            <p style="color: #718096; margin-bottom: 15px;">
                                <strong>Active Security Features:</strong>
                            </p>
                            <ul style="color: #718096; margin-left: 30px;">
                                <li>✅ Screenshot detection & logging</li>
                                <li>✅ Print blocking (Ctrl+P)</li>
                                <li>✅ Copy/paste disabled</li>
                                <li>✅ Right-click disabled</li>
                                <li>✅ Text selection disabled</li>
                                <li>✅ Dynamic watermarks with your identity</li>
                                <li>✅ Session tracking & monitoring</li>
                            </ul>
                            <p style="color: #e53e3e; margin-top: 20px; font-weight: 600;">
                                ⚠️ All violations are logged and reported to the document owner.
                            </p>
                        </div>
                    </div>

                    <div class="alert alert-danger" style="margin-top: 0; border-radius: 0 0 10px 10px;">
                        <strong>⚠️ CONFIDENTIAL DOCUMENT - LEGAL NOTICE</strong>
                        <p style="font-size: 12px; margin-top: 10px;">
                            Session ID: ${state.sessionId} | 
                            Email: ${state.viewerEmail} | 
                            Time: ${formatDate(new Date().toISOString())}
                        </p>
                        <p style="font-size: 12px; margin-top: 5px;">
                            Unauthorized copying, sharing, or distribution is strictly prohibited and may result in legal action.
                        </p>
                    </div>
                </div>
            `;
        }

        // Event Listeners
        function setupEventListeners() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput) {
                fileInput.onchange = (e) => {
                    if (e.target.files[0]) {
                        handleFileUpload(e.target.files[0]);
                    }
                };
            }

            const emailInput = document.getElementById('emailInput');
            if (emailInput) {
                emailInput.oninput = (e) => {
                    state.viewerEmail = e.target.value;
                };
            }

            const codeInput = document.getElementById('codeInput');
            if (codeInput) {
                codeInput.oninput = (e) => {
                    state.accessCode = e.target.value;
                };
                codeInput.onkeypress = (e) => {
                    if (e.key === 'Enter') {
                        handleAuth();
                    }
                };
            }
        }

        function switchMode(mode) {
            state.mode = mode;
            state.isAuthenticated = false;
            render();
        }

        function handleAuth() {
            const emailInput = document.getElementById('emailInput');
            const codeInput = document.getElementById('codeInput');
            
            state.viewerEmail = emailInput.value;
            state.accessCode = codeInput.value;
            
            authenticate();
        }

        // Auto-update viewer time
        setInterval(() => {
            if (state.isAuthenticated) {
                render();
            }
        }, 1000);

        // Initialize app
        window.onload = init;
    </script>
</body>
</html>
